{% extends 'base.html' %}

{% block title %}Reset Password | ICONFST’26 Portal{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8 bg-slate-100">
    <div class="max-w-md w-full space-y-6 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl">
        
        <div class="text-center space-y-2">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/20 text-amber-600 flex items-center justify-center text-2xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 font-heading">
                Reset Account Password
            </h2>
            <p class="text-xs text-slate-500">
                Enter your registered email address to receive password reset instructions.
            </p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                    <input type="email" name="email" required placeholder="yourname@domain.com" class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm shadow-lg shadow-emerald-600/30 transition-all">
                Send Reset Link
            </button>
        </form>

        <div class="text-center text-xs text-slate-500">
            Remembered your password? 
            <a href="{{ url_for('auth.login') }}" class="font-bold text-emerald-700 hover:underline">Return to Login</a>
        </div>

    </div>
</div>
{% endblock %}
