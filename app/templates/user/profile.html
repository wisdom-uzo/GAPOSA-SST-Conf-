{% extends 'base.html' %}

{% block title %}Account Profile Settings | ICONFST’26{% endblock %}

{% block content %}
<div class="bg-gradient-to-r from-slate-900 via-brand-dark to-slate-900 text-white py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-2xl sm:text-3xl font-black font-heading">Account Profile Settings</h1>
        <p class="text-xs text-emerald-200 mt-1">Manage your biographical info and contact details</p>
    </div>
</div>

<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white rounded-3xl p-8 sm:p-10 border border-slate-200 shadow-xl space-y-6">
        
        <form action="{{ url_for('user.profile') }}" method="POST" class="space-y-4">
            <div class="grid grid-cols-4 gap-3">
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Title</label>
                    <select name="title" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                        <option value="Prof." {% if user.title == 'Prof.' %}selected{% endif %}>Prof.</option>
                        <option value="Dr." {% if user.title == 'Dr.' %}selected{% endif %}>Dr.</option>
                        <option value="Engr." {% if user.title == 'Engr.' %}selected{% endif %}>Engr.</option>
                        <option value="Mr." {% if user.title == 'Mr.' %}selected{% endif %}>Mr.</option>
                        <option value="Mrs." {% if user.title == 'Mrs.' %}selected{% endif %}>Mrs.</option>
                        <option value="Ms." {% if user.title == 'Ms.' %}selected{% endif %}>Ms.</option>
                    </select>
                </div>
                <div class="col-span-3">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
                    <input type="text" name="full_name" value="{{ user.full_name }}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                <input type="email" value="{{ user.email }}" disabled class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-xs bg-slate-100 text-slate-500 cursor-not-allowed">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number</label>
                <input type="tel" name="phone" value="{{ user.phone }}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Affiliation / Institution</label>
                <input type="text" name="affiliation" value="{{ user.affiliation }}" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
            </div>

            <button type="submit" class="py-3 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md transition-all">
                Save Changes
            </button>
        </form>

    </div>
</div>
{% endblock %}
